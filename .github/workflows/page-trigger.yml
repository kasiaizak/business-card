
name: Publish website on page push

on:
  push:
    branches:
      - page

permissions:
  contents: read

concurrency:
  group: ovh-sftp-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy page to OVH
    uses: kasiaizak/business-card/.github/workflows/deploy.yml@master

    with:
      page_sha: ${{ github.sha }}

    secrets:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
