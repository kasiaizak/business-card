
name: Deploy website via SFTP

on:
  workflow_call:
    inputs:
      page_sha:
        required: true
        type: string
    secrets:
      SFTP_HOST:
        required: true
      SFTP_USERNAME:
        required: true
      SFTP_PASSWORD:
        required: true
      SFTP_PORT:
        required: true
      SFTP_TARGET:
        required: true
      SFTP_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website to OVH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout page
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.page_sha }}
          persist-credentials: false

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Configure known_hosts
        env:
          HOST_KEYS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment files
        run: |
          mkdir -p deploy_bundle

          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/deploy_bundle/' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            ./ deploy_bundle/

          test -f deploy_bundle/index.html

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          lftp \
            -u "$SFTP_USERNAME,$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "
              set cmd:fail-exit yes;
              set net:max-retries 2;
              set net:timeout 20;
              set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts\";
              mirror -R --verbose --parallel=2 \
                deploy_bundle \"$SFTP_TARGET\";
              bye;
            "
